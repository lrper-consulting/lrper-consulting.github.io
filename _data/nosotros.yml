      nombre: "Sustainability built in"
      descripcion: "Emissions, life cycle and permits are assessed alongside the engineering, not afterwards."
  - es:
      nombre: "Documentación que se sostiene"
      descripcion: "Métodos y supuestos declarados, para que el estudio pueda revisarse y continuarse."
    en:
