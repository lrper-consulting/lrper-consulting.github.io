- id: ignacio-tabilo
  nombre: "Ignacio Tabilo"
  foto: ""
  linkedin: ""
  es:
    titulo: "Ingeniero Civil de Industrias con Diploma en Ingeniería Química y Magíster en Ciencias de la Ingeniería, Pontificia Universidad Católica de Chile"
    enfoque: "Procesos, evaluación técnico-económica y documentación"
    perfil: "Ignacio diagnostica procesos con datos de planta y de laboratorio, y acompaña cada respuesta técnica con su consecuencia económica. Optimizó el tratamiento de agua de una planta exportadora de alimentos, integró el equipo de un estudio de I+D para la minería del cobre y publicó como primer autor una investigación sobre solventes renovables para la captura de CO₂. Documenta y capacita para que las soluciones perduren después del proyecto."
    especialidades:
      - "Diagnóstico y optimización de procesos"
      - "Evaluación técnico-económica"
      - "Simulación de procesos"
      - "Descarbonización e hidrógeno"
      - "Procedimientos y capacitación"
  en:
    titulo: "Ingeniero Civil de Industrias (industrial engineering) with a Diploma in Chemical Engineering and a Master of Science in Engineering, Pontificia Universidad Católica de Chile"
    enfoque: "Process engineering, techno-economic evaluation and documentation"
    perfil: "Ignacio diagnoses processes with plant and laboratory data, and attaches the economic consequence to every technical answer. He optimized the water treatment of a food export plant, was part of the team behind an R&D study for the copper mining industry, and published first-author research on renewable solvents for CO₂ capture. He documents and trains so that solutions outlast the project."
    especialidades:
      - "Process diagnosis and optimization"
      - "Techno-economic evaluation"
      - "Process simulation"
      - "Decarbonization and hydrogen"
      - "Procedures and training"
